# Dataset Configuration for Medical NER Pipeline
random_seed: 42
generation_version: "2.0.0"

source:
  repo_id: "tner/bc5cdr"
  description: "BioCreative V Chemical-Disease Relation (CDR) task dataset"
  splits:
    - "train"
    - "valid"
    - "test"

schema:
  target_labels:
    - "O"
    - "B-DISEASE"
    - "I-DISEASE"
    - "B-MEDICATION"
    - "I-MEDICATION"
    - "B-PATIENT_NAME"
    - "I-PATIENT_NAME"
    - "B-CHEMICAL"
    - "I-CHEMICAL"

synthetic:
  counts:
    train: 4000
    valid: 500
    test: 500
  template_allocation:
    train:
      - "admission_dx_01"
      - "admission_dx_02"
      - "admission_dx_03"
      - "admission_dx_04_tr"
      - "prescription_tx_01"
      - "prescription_tx_02"
      - "prescription_tx_03"
      - "prescription_tx_04_tr"
      - "history_review_01"
      - "history_review_02"
      - "history_review_03"
      - "history_review_04_tr"
      - "followup_discharge_01"
      - "followup_discharge_02_tr"
      - "referral_consult_01"
      - "multi_entity_01"
    valid:
      - "admission_dx_01_va"
      - "admission_dx_02_va"
      - "prescription_tx_01_va"
      - "prescription_tx_02_va"
      - "history_review_01_va"
      - "followup_discharge_01_va"
    test:
      - "admission_dx_01_te"
      - "admission_dx_02_te"
      - "prescription_tx_01_te"
      - "prescription_tx_02_te"
      - "referral_consult_01_te"
      - "multi_entity_01_te"

paths:
  raw_dir: "data/raw"
  synthetic_dir: "data/synthetic"
  processed_dir: "data/processed"
  reports_dir: "reports"

