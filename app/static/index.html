<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clinical NER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,620&family=Outfit:wght@380;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #e9e2d6;
      --sheet: #f7f3eb;
      --ink: #1c1915;
      --muted: #6f675c;
      --line: #d8d0c3;
      --button: #1d3c34;
      --button-ink: #f3eee4;
      --danger: #8c2f2f;
      --disease: #f4d4ce;
      --disease-ink: #7a2d24;
      --medication: #d5ebe3;
      --medication-ink: #1a5c45;
      --chemical: #f4e4c4;
      --chemical-ink: #7a5410;
      --patient: #dbe4f4;
      --patient-ink: #243e6e;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(1200px 500px at 50% -10%, #f6f1e7 0%, transparent 55%),
        var(--paper);
      color: var(--ink);
      font-family: Outfit, "Avenir Next", "Segoe UI", sans-serif;
      font-weight: 380;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 56px 20px 80px;
    }

    main {
      width: min(720px, 100%);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 28px;
    }

    .eyebrow {
      margin: 0 0 8px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 12px;
      color: var(--muted);
    }

    h1 {
      margin: 0;
      font-family: Fraunces, Georgia, serif;
      font-weight: 500;
      font-size: clamp(40px, 6vw, 58px);
      letter-spacing: -0.03em;
      line-height: 0.95;
    }

    .model-mark {
      margin: 0;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }

    .lede {
      margin: 0 0 28px;
      max-width: 46ch;
      font-size: 18px;
      line-height: 1.45;
      color: #3c3832;
    }

    form {
      background: var(--sheet);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 18px 40px rgba(48, 36, 18, 0.06);
    }

    label {
      display: block;
      margin: 2px 4px 10px;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    textarea {
      width: 100%;
      min-height: 148px;
      resize: vertical;
      border: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 18px;
      line-height: 1.55;
      padding: 4px;
    }

    textarea:focus {
      outline: none;
    }

    textarea::placeholder {
      color: #a3988a;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-top: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    button {
      appearance: none;
      border: 0;
      background: var(--button);
      color: var(--button-ink);
      font: inherit;
      font-weight: 500;
      font-size: 15px;
      letter-spacing: 0.01em;
      padding: 12px 18px;
      border-radius: 999px;
      cursor: pointer;
    }

    button:hover { background: #16332c; }
    button:focus-visible {
      outline: 2px solid var(--button);
      outline-offset: 3px;
    }
    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin: 22px 4px 0;
      padding: 0;
      list-style: none;
    }

    .legend li {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .swatch.disease { background: var(--disease-ink); }
    .swatch.medication { background: var(--medication-ink); }
    .swatch.chemical { background: var(--chemical-ink); }
    .swatch.patient { background: var(--patient-ink); }

    #output {
      margin-top: 28px;
    }

    .status {
      margin: 0;
      color: var(--danger);
      font-size: 15px;
    }

    .passage {
      margin: 0;
      font-family: Fraunces, Georgia, serif;
      font-size: 22px;
      font-weight: 500;
      line-height: 1.55;
      letter-spacing: -0.015em;
    }

    mark {
      padding: 0 0.12em;
      border-radius: 0.2em;
      color: inherit;
      background: transparent;
    }

    mark.disease { background: var(--disease); color: var(--disease-ink); }
    mark.medication { background: var(--medication); color: var(--medication-ink); }
    mark.chemical { background: var(--chemical); color: var(--chemical-ink); }
    mark.patient_name { background: var(--patient); color: var(--patient-ink); }

    .found {
      margin: 22px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
    }

    .found li {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: baseline;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
      font-size: 15px;
    }

    .found .type {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .quiet {
      margin: 0;
      color: var(--muted);
    }

    .reading + .reading {
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    .reading h2 {
      margin: 0 0 12px;
      font-family: Outfit, "Avenir Next", sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      body { padding-top: 32px; }
      header { display: block; }
      .model-mark { margin-top: 10px; }
      .row { align-items: stretch; flex-direction: column-reverse; }
      button { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Medical named entity recognition</p>
        <h1>Read a note.</h1>
      </div>
      <p class="model-mark">HMM · MEMM · CRF</p>
    </header>
    <p class="lede">Paste a sentence. The three models already in this project each mark disease, medication, chemical, and patient name.</p>

    <form id="form">
      <label for="note">Clinical note</label>
      <textarea id="note" name="text" placeholder="Patient Jane Smith was admitted with pulmonary embolism and started on heparin." required></textarea>
      <div class="row">
        <p class="hint">One note at a time. Not for clinical use.</p>
        <button id="submit" type="submit">Extract entities</button>
      </div>
    </form>

    <ul class="legend" aria-label="Entity colors">
      <li><span class="swatch disease"></span>Disease</li>
      <li><span class="swatch medication"></span>Medication</li>
      <li><span class="swatch chemical"></span>Chemical</li>
      <li><span class="swatch patient"></span>Patient name</li>
    </ul>

    <section id="output" aria-live="polite"></section>
  </main>
  <script>
    const form = document.getElementById("form");
    const note = document.getElementById("note");
    const submit = document.getElementById("submit");
    const output = document.getElementById("output");

    const LABELS = {
      DISEASE: "Disease",
      MEDICATION: "Medication",
      CHEMICAL: "Chemical",
      PATIENT_NAME: "Patient name"
    };

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function markedPassage(text, entities) {
      // The server reports offsets in Unicode code points (Python string indices).
      // JavaScript strings index UTF-16 units, so slice a code-point array instead;
      // otherwise any emoji or other astral character shifts every later highlight.
      const chars = Array.from(text);
      const slice = (start, end) => chars.slice(start, end).join("");
      const ordered = [...entities].sort((a, b) => a.start - b.start || b.end - a.end);
      let html = "";
      let cursor = 0;
      const kept = [];
      for (const entity of ordered) {
        if (entity.start < cursor) continue;
        html += escapeHtml(slice(cursor, entity.start));
        html += `<mark class="${entity.type.toLowerCase()}">${escapeHtml(slice(entity.start, entity.end))}</mark>`;
        cursor = entity.end;
        kept.push(entity);
      }
      html += escapeHtml(slice(cursor));
      return { html, kept };
    }

    function render(data) {
      const text = data.text;
      const blocks = (data.models || []).map((reading) => {
        const entities = reading.entities || [];
        if (!entities.length) {
          return `<section class="reading"><h2>${escapeHtml(reading.model)}</h2><p class="quiet">No entities.</p></section>`;
        }
        const passage = markedPassage(text, entities);
        const items = passage.kept.map((entity) => {
          const label = LABELS[entity.type] || entity.type;
          return `<li><span>${escapeHtml(entity.text)}</span><span class="type">${escapeHtml(label)}</span></li>`;
        }).join("");
        return `<section class="reading"><h2>${escapeHtml(reading.model)}</h2><p class="passage">${passage.html}</p><ul class="found">${items}</ul></section>`;
      }).join("");
      output.innerHTML = blocks;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = note.value;
      submit.disabled = true;
      submit.textContent = "Reading…";
      output.innerHTML = "";
      try {
        const response = await fetch("/api/extract", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });
        const data = await response.json();
        if (!response.ok) {
          output.innerHTML = `<p class="status">${escapeHtml(data.error || "The tagger could not read this note.")}</p>`;
          return;
        }
        render(data);
      } catch (err) {
        output.innerHTML = '<p class="status">The page could not reach the tagger.</p>';
      } finally {
        submit.disabled = false;
        submit.textContent = "Extract entities";
      }
    });
  </script>
</body>
</html>
